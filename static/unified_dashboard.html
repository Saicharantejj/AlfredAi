<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred — Dashboard</title>
  <meta name="description" content="Alfred AI Command Center" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      /* Shared Tokens */
      --font-display: 'Playfair Display', Georgia, serif;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Geist Mono', monospace;
      --r: 32px; 
      --r-sm: 14px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

      /* Accent Colors */
      --red: #ff1100;
      --blue: #007aff;
      --indigo: #5856d6;
      --green: #34c759;
      --orange: #ff9500;
      --violet: #af52de;

      /* Light Theme (Default) */
      --bg: #fdf5f5;
      --surface: rgba(255, 255, 255, 0.75);
      --border: rgba(0, 0, 0, 0.05);
      --text: #111111;
      --text-2: #555555;
      --text-3: #999999;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.1), 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg: #0a0505;
      --surface: rgba(18, 18, 18, 0.7);
      --border: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
      --text-2: #888888;
      --text-3: #555555;
      --shadow-sm: 0 4px 12px rgba(255, 0, 0, 0.1);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, 1);
    }

    /* Grain Texture Overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    html {
      scroll-behavior: smooth
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out);
    }

    .spline-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: all; 
      opacity: 0.8;
      transition: opacity 1s ease;
    }

    [data-theme="dark"] .spline-bg {
      opacity: 0.6;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at var(--field-x, 50%) var(--field-y, 50%), hsla(0, 95%, 65%, 0.1), transparent 30%),
        radial-gradient(circle at var(--field-x2, 60%) var(--field-y2, 40%), hsla(340, 100%, 65%, 0.08), transparent 25%),
        radial-gradient(circle at calc(var(--field-x, 50%) - 15%) calc(var(--field-y, 50%) + 10%), hsla(10, 90%, 70%, 0.07), transparent 28%);
      opacity: 0.7;
      transition: opacity 1s var(--ease-out);
    }

    .wrap {
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ── Navbar ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255, 17, 0, 0.2);
      transition: all 0.4s var(--ease-spring);
      cursor: pointer;
    }

    .brand-mark span {
      color: #000;
      font-weight: 900;
      font-size: 20px;
    }

    .brand-info .name {
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .top-right {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .btn {
      padding: 10px 24px;
      border-radius: var(--r-sm);
      border: none;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s var(--ease-out);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-dark {
      background: var(--text);
      color: var(--bg);
    }

    /* ── Welcome Banner ── */
    .welcome {
      padding: 80px 0;
      margin-bottom: 60px;
      position: relative;
    }

    .welcome-greeting {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--red);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .welcome-name {
      font-family: var(--font-sans);
      font-size: 84px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -4px;
      text-transform: uppercase;
      background: linear-gradient(to bottom, var(--text) 0%, var(--text-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    .welcome-time {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 120px;
      font-weight: 200;
      opacity: 0.05;
      pointer-events: none;
    }

    /* ── Cards & Grid ── */
    .grid { display: grid; gap: 24px; }
    .row-3 { grid-template-columns: repeat(3, 1fr); }
    .row-main { grid-template-columns: 2fr 1fr 1fr; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 32px;
      position: relative;
      transition: all 0.4s var(--ease-out);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
    }

    .card:hover {
      border-color: rgba(255, 17, 0, 0.25);
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }

    .card-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dot {
      width: 6px; height: 6px;
      background: var(--red);
      display: inline-block;
      margin-right: 10px;
      border-radius: 50%;
    }

    /* ── Widgets ── */
    .time-big { font-family: var(--font-display); font-size: 68px; font-weight: 900; margin-bottom: 6px; }
    .w-temp { font-family: var(--font-display); font-size: 58px; font-weight: 900; }
    .stock-row, .task-row, .note-row, .event-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; border-radius: var(--r-sm); background: rgba(0,0,0,0.02); margin-bottom: 6px;
    }

    /* ... more styles ... */
  </style>
</head>

<body data-theme="light">
  <div class="spline-bg">
    <spline-viewer url="https://prod.spline.design/kZ6uCthOcaCHhtw3/scene.splinecode"></spline-viewer>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark"><span>A</span></div>
        <div class="brand-info"><div class="name">Alfred</div></div>
      </div>
      <div class="top-right">
        <button onclick="toggleTheme()" class="btn btn-light" id="themeBtn">☀️</button>
        <a href="#" class="btn btn-dark">Chat →</a>
      </div>
    </div>

    <div class="welcome">
      <div class="welcome-greeting" id="welcomeGreeting">GOOD NIGHT</div>
      <div class="welcome-name" id="welcomeName">SAICHARAN.</div>
      <div class="welcome-sub" id="welcomeSub">Rest well, big day tomorrow.</div>
      <div class="welcome-time" id="welcomeTime">00:15</div>
    </div>

    <div class="grid row-main">
      <div class="card">
        <div class="card-tag"><span><span class="dot"></span>Local Time</span></div>
        <div class="time-big" id="time">00:15</div>
        <div class="date-str">Saturday, April 12, 2026</div>
      </div>
      <div class="card">
        <div class="card-tag"><span><span class="dot" style="background:var(--orange)"></span>Weather</span></div>
        <div class="w-temp">24°C</div>
        <div class="w-desc">Mainly Cloudy</div>
      </div>
      <div class="card">
        <div class="card-tag"><span><span class="dot" style="background:var(--green)"></span>Markets</span></div>
        <div class="stock-row"><span>AAPL</span><span>$182.41</span></div>
        <div class="stock-row"><span>BTC</span><span>$64.2k</span></div>
      </div>
    </div>

    <!-- Additional sections like in the original ... -->

  </div>

  <script>
    // Logic for combining everything
    console.log("Alfred Dashboard Combined Logic Initialized");
    
    function toggleTheme() {
      const body = document.body;
      const theme = body.getAttribute('data-theme');
      body.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
      document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    // Shortcut Engine Inlined
    const AlfredShortcuts = (() => {
      // Inlined shortcut-engine.js content here...
      return { init: () => console.log("Shortcuts Initialized") };
    })();
    AlfredShortcuts.init();
  </script>
</body>
</html>
