<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alfred</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0404;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .logo {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #ff1100, #cc0d00);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(255, 17, 0, 0.35);
    margin-bottom: 28px;
    animation: pulse 2s ease-in-out infinite;
  }

  .logo svg { width: 36px; height: 36px; }

  .name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'SF Mono', 'Menlo', monospace;
    margin-bottom: 48px;
  }

  .dots {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,17,0,0.6);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(255,17,0,0.35); }
    50%       { box-shadow: 0 0 60px rgba(255,17,0,0.55); }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1;   }
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L3 22H7L12 10L17 22H21L12 2Z" fill="white"/>
      <path d="M9 16H15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="name">Alfred</div>
  <div class="tagline">Personal Intelligence</div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div id="status" style="margin-top:24px;font-size:11px;color:rgba(255,255,255,0.2);font-family:'SF Mono',monospace;letter-spacing:0.1em;">
    Starting backend…
  </div>

  <script>
    // Cycle through status messages so it feels alive
    const messages = [
      'Starting backend…',
      'Loading modules…',
      'Connecting services…',
      'Almost ready…',
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      el.textContent = messages[i];
    }, 3000);
  </script>
</body>
</html>
