<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Alfred — Startup Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0404; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 16px; padding: 40px;
    -webkit-app-region: drag;
  }
  .icon { font-size: 48px; }
  h1 { font-size: 22px; font-weight: 700; }
  p  { font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; max-width: 420px; line-height: 1.6; }
  .path { font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.07);
          padding: 10px 16px; border-radius: 8px; color: rgba(255,255,255,0.6); margin-top: 8px; }
  button {
    margin-top: 8px; padding: 10px 24px; border-radius: 10px;
    background: #ff1100; color: #fff; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; -webkit-app-region: no-drag;
  }
  button:hover { background: #cc0d00; }
</style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1>Alfred couldn't start</h1>
  <p>The backend didn't respond in time. This usually means a missing API key or a port conflict.</p>
  <div class="path" id="logPath">Check logs in: ~/Library/Application Support/Alfred/logs/</div>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
